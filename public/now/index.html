  var onZh = !onEn && !onJa;

  if (/^ja/.test(lang)) {
    preferred = 'ja';

  var target;
  if (preferred === 'zh') {

  } else {
    target = '/' + preferred + stripped;
  }

  window.location.replace(target);
})();
