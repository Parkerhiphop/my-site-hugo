<script>
(function () {
  // Only auto-redirect once per browser session to respect manual navigation.
  if (sessionStorage.getItem('lang-redirected')) return;
  sessionStorage.setItem('lang-redirected', '1');

  var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
  var path = window.location.pathname;

  // Detect whether we're already on a language-prefixed path.
  var onEn = path === '/en' || path.startsWith('/en/');
  var onJa = path === '/ja' || path.startsWith('/ja/');
  // zh-TW is the default and lives at the root (no prefix).
  var onZh = !onEn && !onJa;

  // Map navigator.language to a preferred language.
  var preferred;
  if (/^ja/.test(lang)) {
    preferred = 'ja';
  } else if (/^zh/.test(lang)) {
    preferred = 'zh';
  } else {
    preferred = 'en';
  }

  var alreadyCorrect =
    (preferred === 'zh' && onZh) ||
    (preferred === 'en' && onEn) ||
    (preferred === 'ja' && onJa);

  if (alreadyCorrect) return;

  // Strip any existing language prefix to get the content-relative path.
  var stripped = path.replace(/^\/(en|ja)/, '') || '/';

  var target;
  if (preferred === 'zh') {
    target = stripped;
  } else {
    target = '/' + preferred + stripped;
  }

  window.location.replace(target);
})();
</script>
